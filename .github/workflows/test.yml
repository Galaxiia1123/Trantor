name: Workbench checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -c requirements.lock.txt -e ".[test,browser]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --test tests/test_definition.js
      - run: python -m playwright install chromium
      - run: python scripts/browser_v11.py --channel chromium
      - run: python scripts/browser_smoke.py --channel chromium
      - if: github.event_name == 'workflow_dispatch'
        run: python scripts/verify_install.py --browser --channel chromium
